<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cloud To-Do App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
      color: #1a1a18;
    }
    .app { width: 100%; max-width: 560px; }
    .header { margin-bottom: 2rem; }
    .title { font-size: 22px; font-weight: 500; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; color: #888780; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #1D9E75; display: inline-block; }
    .cloud-badge {
      font-size: 11px; background: #fff; border: 0.5px solid #d3d1c7;
      border-radius: 20px; padding: 2px 8px; color: #888780;
    }
    .input-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .input-row input {
      flex: 1; height: 40px; padding: 0 14px;
      border-radius: 8px; border: 0.5px solid #b4b2a9;
      background: #fff; color: #1a1a18;
      font-size: 14px; font-family: inherit; outline: none; transition: border 0.15s;
    }
    .input-row input:focus { border-color: #888780; box-shadow: 0 0 0 3px rgba(128,128,128,0.1); }
    .input-row input::placeholder { color: #b4b2a9; }
    .add-btn {
      height: 40px; padding: 0 16px; border-radius: 8px;
      border: 0.5px solid #b4b2a9; background: #fff;
      color: #1a1a18; font-size: 13px; font-family: inherit;
      cursor: pointer; white-space: nowrap; transition: background 0.12s, transform 0.1s;
    }
    .add-btn:hover { background: #f1efe8; }
    .add-btn:active { transform: scale(0.97); }
    .stats { display: flex; gap: 12px; margin-bottom: 1rem; }
    .stat { flex: 1; background: #fff; border-radius: 8px; padding: 10px 14px; border: 0.5px solid #d3d1c7; }
    .stat-n { font-size: 20px; font-weight: 500; }
    .stat-l { font-size: 11px; color: #888780; margin-top: 1px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 1rem; }
    .tab {
      padding: 5px 12px; font-size: 12px; border-radius: 20px;
      border: 0.5px solid transparent; cursor: pointer;
      font-family: inherit; background: transparent; color: #888780; transition: all 0.15s;
    }
    .tab.active { border-color: #b4b2a9; background: #fff; color: #1a1a18; font-weight: 500; }
    .task-list { display: flex; flex-direction: column; gap: 6px; }
    .task {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 12px;
      border: 0.5px solid #d3d1c7; background: #fff; transition: border 0.15s, opacity 0.2s;
    }
    .task:hover { border-color: #b4b2a9; }
    .task.done { opacity: 0.5; }
    .check {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid #b4b2a9; background: transparent;
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .check.checked { background: #1D9E75; border-color: #1D9E75; }
    .check svg { display: none; }
    .check.checked svg { display: block; }
    .task-text { flex: 1; font-size: 14px; color: #1a1a18; }
    .task.done .task-text { text-decoration: line-through; color: #888780; }
    .del-btn {
      width: 24px; height: 24px; border: none; background: none;
      cursor: pointer; color: #b4b2a9; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; transition: color 0.12s, background 0.12s; opacity: 0;
    }
    .task:hover .del-btn { opacity: 1; }
    .del-btn:hover { color: #E24B4A; background: #f1efe8; }
    .empty { text-align: center; padding: 3rem 1rem; color: #b4b2a9; font-size: 14px; }
    .loading { text-align: center; padding: 2rem; color: #888780; font-size: 13px; }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a18; color: #f1efe8; }
      .input-row input, .add-btn, .stat, .task { background: #2c2c2a; border-color: #444441; color: #f1efe8; }
      .input-row input::placeholder { color: #5f5e5a; }
      .add-btn:hover { background: #3a3a38; }
      .tab.active { background: #2c2c2a; border-color: #444441; color: #f1efe8; }
      .del-btn:hover { background: #3a3a38; }
      .cloud-badge { background: #2c2c2a; border-color: #444441; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">My Tasks</div>
    <div class="subtitle">
      <span class="dot"></span>
      <span id="sync-label">Loading from cloud...</span>
      <span class="cloud-badge">cloud storage</span>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="Add a new task..." maxlength="120" />
    <button class="add-btn" id="add-btn">+ Add</button>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="stat-n" id="total-n">0</div><div class="stat-l">total</div></div>
    <div class="stat"><div class="stat-n" id="done-n">0</div><div class="stat-l">completed</div></div>
    <div class="stat"><div class="stat-n" id="left-n">0</div><div class="stat-l">remaining</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="active">Active</button>
    <button class="tab" data-filter="done">Done</button>
  </div>

  <div id="task-list" class="task-list"><div class="loading">Loading your tasks...</div></div>
</div>

<script>
  // ── Storage: uses localStorage for persistence in this standalone file ──
  const STORAGE_KEY = 'todo-tasks-v1';
  let tasks = [];
  let filter = 'all';

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    } catch(e) { tasks = []; }
    render();
    document.getElementById('sync-label').textContent = 'Saved locally';
  }

  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      document.getElementById('sync-label').textContent = 'Saved';
      setTimeout(() => document.getElementById('sync-label').textContent = 'Saved locally', 1200);
    } catch(e) {}
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const left = total - done;
    const statsEl = document.getElementById('stats');

    if (total > 0) {
      statsEl.style.display = 'flex';
      document.getElementById('total-n').textContent = total;
      document.getElementById('done-n').textContent = done;
      document.getElementById('left-n').textContent = left;
    } else {
      statsEl.style.display = 'none';
    }

    const visible = tasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done') return t.done;
      return true;
    });

    const listEl = document.getElementById('task-list');
    if (visible.length === 0) {
      const msgs = { all: 'No tasks yet — add one above!', active: 'No active tasks.', done: 'Nothing completed yet.' };
      listEl.innerHTML = `<div class="empty">${msgs[filter]}</div>`;
      return;
    }

    listEl.innerHTML = visible.map(t => `
      <div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
        <div class="check ${t.done ? 'checked' : ''}" data-toggle="${t.id}">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 4L3.8 7L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="task-text">${escHtml(t.text)}</span>
        <button class="del-btn" data-delete="${t.id}" title="Delete">×</button>
      </div>
    `).join('');
  }

  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now() + Math.random(), text, done: false, created: Date.now() });
    input.value = '';
    render();
    saveTasks();
  }

  document.getElementById('add-btn').addEventListener('click', addTask);
  document.getElementById('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      filter = tab.dataset.filter;
      render();
    });
  });

  document.getElementById('task-list').addEventListener('click', e => {
    const toggleId = e.target.closest('[data-toggle]')?.dataset.toggle;
    const deleteId = e.target.closest('[data-delete]')?.dataset.delete;
    if (toggleId) {
      const t = tasks.find(t => String(t.id) === String(toggleId));
      if (t) { t.done = !t.done; render(); saveTasks(); }
    }
    if (deleteId) {
      tasks = tasks.filter(t => String(t.id) !== String(deleteId));
      render(); saveTasks();
    }
  });

  loadTasks();
</script>
</body>
</html>
